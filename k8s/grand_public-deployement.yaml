kind: Deployment
apiVersion: apps/v1
metadata:
  name: front-grand-public
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front_grand_public
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: front_grand_public
    spec:
      containers:
        - name: front-grand-public
          image: registry.seven-app.cf/cmr-portail/fron_grand_public
          imagePullPolicy: Always
          ports:
            - containerPort: 80
      imagePullSecrets:
      - name: regcred
      restartPolicy: Always
